<style>
/* Layout: uma coluna, barra de separadores em baixo, uma tarefa de cada vez em "Hoje". */
:root{
  --bg:#F2F5F4; --surface:#FBFCFB; --surface-2:#E4ECE9; --fg:#1E2B2F; --muted:#52636A; --line:#CAD6D3;
  --accent:#0F6B73; --accent-ink:#FFFFFF; --accent-soft:#D3EAEA;
  --warn:#A8430A; --warn-soft:#F7E2D3; --good:#1F7A45; --good-soft:#D9EEE0;
  --scrim:rgba(12,24,27,.5);
  --font:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:17px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111A1C; --surface:#182225; --surface-2:#243135; --fg:#E5EEEC; --muted:#9DB0B3; --line:#2E3D41;
    --accent:#5CC4CB; --accent-ink:#082326; --accent-soft:#153A3D;
    --warn:#F4A672; --warn-soft:#3A2519; --good:#6FCB91; --good-soft:#173325;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A1C; --surface:#182225; --surface-2:#243135; --fg:#E5EEEC; --muted:#9DB0B3; --line:#2E3D41;
  --accent:#5CC4CB; --accent-ink:#082326; --accent-soft:#153A3D;
  --warn:#F4A672; --warn-soft:#3A2519; --good:#6FCB91; --good-soft:#173325;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
:root[data-size="large"]{font-size:20px}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:1rem; line-height:1.6;
  letter-spacing:.01em; word-spacing:.05em; text-align:left; hyphens:none; -webkit-text-size-adjust:100%;
}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
h1{font-size:1.75rem;line-height:1.25;font-weight:600}
h2{font-size:1.35rem;line-height:1.35;font-weight:600;text-wrap:balance}
h3{font-size:1.1rem;line-height:1.4;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit;word-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

.app{
  max-width:720px; margin:0 auto; min-width:0;
  padding-block:20px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{display:grid;gap:20px;outline:none;min-width:0}
.head{display:grid;gap:2px}
.head.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.label{font-size:.95rem;font-weight:500;color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;min-width:0}
.card.now{border:2px solid var(--accent)}
.card.center{justify-items:center;text-align:center}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:14px;padding:12px 14px}
.banner p{flex:1 1 220px}

.btn{
  min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center
}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.big{min-height:56px;font-size:1.1rem;width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions.center{justify-content:center}

.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.subj,.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.88rem;line-height:1.5;background:var(--surface-2)}
.subj{background:var(--surface-2);background:color-mix(in srgb,var(--c) 16%,var(--bg))}
.subj::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.tag{border:1px solid var(--line);background:transparent}
.tag.ev{background:var(--accent-soft);border-color:transparent}
.tag.late{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ex{border-style:dashed;color:var(--muted)}

.list{display:grid;gap:8px}
.group{display:grid;gap:8px}
.group>h3{color:var(--muted);font-size:1rem;font-weight:500}
.group.late>h3{color:var(--warn)}
.task{display:flex;gap:6px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px 10px 6px;min-width:0}
.task.done .ttitle{color:var(--muted)}
.tbody{display:grid;gap:4px;min-width:0;flex:1;padding-top:7px}
.ttitle{background:none;border:0;padding:0;text-align:left;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.for{font-size:.9rem;color:var(--muted)}
.check{flex:none;width:44px;height:44px;background:none;border:0;padding:0;display:grid;place-items:center}
.check .box{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--muted);display:grid;place-items:center}
.check[aria-checked="true"] .box{background:var(--good);border-color:var(--good)}
.check[aria-checked="true"] .box::after{content:"";width:8px;height:14px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.small .box{width:24px;height:24px}

.steps{display:grid;gap:2px}
.steps li{display:flex;align-items:center;gap:4px;min-width:0}
.steps li span{overflow-wrap:anywhere}
.steps li.done span{color:var(--muted)}

.evrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.evrow .tbody{padding-top:0}
.count{font-weight:600;color:var(--accent);white-space:nowrap}
.count.soon{color:var(--warn)}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn,.kind span{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;font-weight:500}
.chipbtn.on,.kind input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kinds{display:flex;gap:8px;flex-wrap:wrap}
.kind{position:relative}
.kind input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.kind input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

.field{display:grid;gap:6px;margin:0 0 16px;border:0;padding:0;min-width:0}
.field label,.lbl,legend{font-weight:500;padding:0}
input[type=text],input[type=date],input[type=time],select,textarea{
  width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)
}
textarea{resize:vertical;line-height:1.5}
.checkline label{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.checkline input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.err{color:var(--warn);font-weight:500}
.inline{display:flex;gap:8px;margin-top:8px}
.inline input{flex:1}

.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.week-nav .t{font-weight:600;text-align:center;flex:1}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.day.today{border:2px solid var(--accent)}
.day-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.day-head h3{font-size:1.05rem}
.day .task{border:0;background:transparent;padding:0}
.day .none{color:var(--muted);font-size:.95rem}

.ring{width:min(72vw,300px);aspect-ratio:1;max-width:100%;position:relative}
.ring svg{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:12}
.ring-bg{stroke:var(--surface-2)}
.ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring-fg.break{stroke:var(--good)}
.ring .time{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}
.sess{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.sess:last-child{border-bottom:0}

.sub-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0}
.sub-row .nm{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c)}
textarea.mono{font-size:.85rem;line-height:1.4;min-height:110px}
.sec{display:grid;gap:12px}

.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))
}
.tabs ul{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;max-width:720px;margin:0 auto}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.8rem;font-weight:500}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-width:720px;max-height:calc(100% - 16px);overflow:auto;border-radius:20px 20px 0 0;outline:none;
  padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));

}

<script>
(function(){
'use strict';

/* ---------- constantes ---------- */
const KEY='caderno-estudo-v1';
const MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MONL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WD=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const WDL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const KINDS={
  tpc:{label:'TPC',ev:false,act:true},
  teste:{label:'Teste',ev:true,act:false},
  apresentacao:{label:'Apresentação',ev:true,act:false},
  grupo:{label:'Trabalho de grupo',ev:true,act:true},
  audicao:{label:'Audição',ev:true,act:false},

};
const FORM_KINDS=['tpc','teste','apresentacao','grupo','audicao'];
const PLAN={
  teste:['Ler os apontamentos','Fazer um resumo curto','Resolver exercícios','Rever os erros e as dúvidas'],
  apresentacao:['Escolher as ideias principais','Preparar os diapositivos','Ensaiar em voz alta','Ensaio final com o tempo'],
  audicao:['Rever o repertório com calma','Estudar as frases mais difíceis','Cantar do princípio ao fim','Ensaio final']
};
const GROUP_STEPS=['Combinar quem faz o quê','Fazer a minha parte','Juntar tudo com o grupo','Rever e entregar'];
const PLACEHOLDER={tpc:'Ex.: Ficha de exercícios, página 84',teste:'Ex.: Teste de Matemática, capítulo 3',apresentacao:'Ex.: Apresentação sobre o Egito',grupo:'Ex.: Cartaz sobre os ecossistemas',audicao:'Ex.: Audição de canto'};
const PLAN_LABEL={teste:'Criar plano de preparação, um passo por dia antes do teste',apresentacao:'Criar plano de preparação, um passo por dia antes da apresentação',audicao:'Criar plano de preparação, um passo por dia antes da audição',grupo:'Criar passos para o trabalho'};
const PALETTE=['#D9480F','#1971C2','#7048E8','#2F9E44','#9C6B1E','#0C8599','#C2255C','#AE3EC9','#5F7A1F','#E08A00','#C92A2A','#3B5BDB','#087F5B','#B5179E','#A61E4D','#5C7CFA','#E8590C','#2B8A3E'];
const DEFAULT_SUBJECTS=['Português','Matemática','Inglês','Espanhol','Ciências Naturais','Físico-Química','História','Geografia','Cidadania e Desenvolvimento','Educação Física','Formação Musical','Canto','Estúdio de Ópera'];
const SUGGEST=[];
const PRAISE=['Boa!','Muito bem!','Feito!','Mais uma!'];
const TIME_RE=/^([01]\d|2[0-3]):[0-5]\d$/;
/* Horário escolar da Alice. Dia: 0 domingo a 6 sábado. Linhas: dia, início, fim, nome, disciplina, tipo, sala */
const DEFAULT_TT=[
  [1,'08:30','09:25','Ciências Naturais','Ciências Naturais','aula','2.5'],
  [1,'09:35','10:30','Físico-Química (Laboratório)','Físico-Química','aula','2.1'],
  [1,'10:50','11:45','Matemática','Matemática','aula','2.8'],
  [1,'11:50','12:45','Educação Física','Educação Física','aula','Black Box 1.1'],

  [1,'17:00','17:45','Apoio ao Estudo','','apoio',''],
  [2,'08:30','09:25','Matemática','Matemática','aula','1.5'],
  [2,'09:35','10:30','Matemática','Matemática','aula','1.5'],
  [2,'10:50','11:45','Português','Português','aula','1.5'],
  [2,'11:50','12:45','Português','Português','aula','1.5'],
  [2,'13:55','14:50','Geografia','Geografia','aula','2.0'],
  [2,'18:00','19:30','Voleibol','','atividade',''],
  [3,'08:30','09:25','História','História','aula','2.8'],
  [3,'09:35','10:30','Inglês','Inglês','aula','2.8'],
  [3,'10:50','11:45','Cidadania e Desenvolvimento','Cidadania e Desenvolvimento','aula','2.8'],
  [3,'11:50','12:45','Espanhol','Espanhol','aula','1.13'],
  [3,'12:50','13:45','Formação Musical','Formação Musical','aula','1.7'],
  [3,'17:15','18:00','Apoio ao Estudo','','apoio',''],
  [4,'08:30','09:25','Físico-Química','Físico-Química','aula','2.3'],
  [4,'09:35','10:30','Português','Português','aula','2.8'],
  [4,'10:50','11:45','Matemática','Matemática','aula','2.8'],
  [4,'11:50','12:45','Ciências Naturais','Ciências Naturais','aula','2.2'],
  [4,'15:00','17:30','Estúdio de Ópera','Estúdio de Ópera','aula',''],
  [4,'18:00','20:00','Voleibol','','atividade',''],
  [5,'08:30','09:25','Educação Física','Educação Física','aula','Black Box 1.1'],
  [5,'09:35','10:30','Geografia','Geografia','aula','2.9'],
  [5,'10:50','11:45','História','História','aula','2.9'],
  [5,'11:50','12:45','Inglês','Inglês','aula','2.9'],
  [5,'12:50','13:45','Espanhol','Espanhol','aula','1.13'],
  [5,'15:00','15:55','Português','Português','aula','1.13'],
  [6,'10:30','12:00','Voleibol','','atividade','']
];
/* Plano de estudo por dia da semana: n blocos de 10 min a partir de "at", e treino de canto */
const DEFAULT_PLAN={
  0:{n:0,at:'11:00',canto:false,cantoAt:'11:00'},
  1:{n:1,at:'18:10',canto:true,cantoAt:'18:30'},
  2:{n:1,at:'16:30',canto:true,cantoAt:'16:50'},
  3:{n:1,at:'18:15',canto:true,cantoAt:'18:35'},
  4:{n:0,at:'20:30',canto:false,cantoAt:'20:30'},
  5:{n:2,at:'18:00',canto:true,cantoAt:'18:35'},
  6:{n:2,at:'15:00',canto:true,cantoAt:'15:35'}
};
const ID_RE=/^[A-Za-z0-9_-]{1,24}$/;
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;

/* ---------- utilitários ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const isHex=c=>/^#[0-9a-fA-F]{6}$/.test(c||'');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const todayStr=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const dm=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
const dayLabel=s=>{const d=parse(s);return cap(WD[d.getDay()])+', '+d.getDate()+' '+MON[d.getMonth()]};
function rangeLabel(a,b){
  const x=parse(a),y=parse(b);
  return x.getMonth()===y.getMonth()?x.getDate()+' a '+y.getDate()+' '+MON[y.getMonth()]:x.getDate()+' '+MON[x.getMonth()]+' a '+y.getDate()+' '+MON[y.getMonth()];
}
function fmtMin(m){const h=Math.floor(m/60),r=m%60;return h?h+' h'+(r?' '+r+' min':''):m+' min'}

/* ---------- estado ---------- */
function defaultPlan(){
  const days={};
  Object.keys(DEFAULT_PLAN).forEach(k=>{days[k]=Object.assign({},DEFAULT_PLAN[k])});
  return{days:days,done:{}};
}
function cleanPlan(p){
  const out=defaultPlan();
  if(!p||typeof p!=='object')return out;
  const d=p.days&&typeof p.days==='object'?p.days:{};
  for(let i=0;i<7;i++){
    const x=d[i],cur=out.days[i];
    if(!x||typeof x!=='object')continue;
    out.days[i]={n:[0,1,2].indexOf(x.n)>=0?x.n:cur.n,at:TIME_RE.test(x.at||'')?x.at:cur.at,canto:x.canto===undefined?cur.canto:!!x.canto,cantoAt:TIME_RE.test(x.cantoAt||'')?x.cantoAt:cur.cantoAt};
  }
  const dn=p.done&&typeof p.done==='object'?p.done:{};
  Object.keys(dn).forEach(k=>{
    if(/^\d{4}-\d{2}-\d{2}:(b1|b2|c)$/.test(k)&&dn[k]&&typeof dn[k].t==='string')out.done[k]={t:dn[k].t.slice(0,200),s:typeof dn[k].s==='string'?dn[k].s:''};
  });
  return out;
}
function buildTT(){
  const out=[];
  DEFAULT_TT.forEach(r=>{
    let sid='';
    if(r[4]){
      let s=state.subjects.find(x=>x.name===r[4]);
      if(!s){
        const used=state.subjects.map(x=>x.color);
        s={id:uid(),name:r[4],color:PALETTE.find(c=>used.indexOf(c)<0)||PALETTE[state.subjects.length%PALETTE.length]};
        state.subjects.push(s);
      }
      sid=s.id;
    }
    out.push({id:uid(),day:r[0],start:r[1],end:r[2],name:r[3],subject:sid,kind:r[5],room:r[6]});
  });
  return out;
}
function blank(){return{v:1,subjects:[],tasks:[],sessions:[],tt:null,plan:defaultPlan(),prefs:{size:'normal',minutes:15,sound:true,rate:.9}}}
function mkTask(o){return Object.assign({id:uid(),title:'',subject:'',kind:'tpc',due:todayStr(),done:false,doneAt:null,notes:'',teams:false,steps:[],example:false,parent:null},o)}
function buildPlan(kind,due,subject,parent,today,example){
  const titles=PLAN[kind];if(!titles)return[];
  const avail=Math.min(titles.length,diff(due,today));
  const out=[];
  for(let i=0;i<avail;i++){
    out.push(mkTask({title:titles[titles.length-avail+i],subject:subject,kind:'revisao',due:addDays(due,-(avail-i)),parent:parent,example:!!example}));
  }
  return out;
}
function seed(){
  const s=blank(),t=todayStr();
  s.subjects=DEFAULT_SUBJECTS.map((n,i)=>({id:'s'+(i+1),name:n,color:PALETTE[i%PALETTE.length]}));
  const S=n=>s.subjects.find(x=>x.name===n).id;
  s.tasks.push(mkTask({title:'Ficha de exercícios, página 84',subject:S('Matemática'),kind:'tpc',due:addDays(t,1),example:true}));
  s.tasks.push(mkTask({title:'Ler o capítulo 3 e responder às perguntas',subject:S('Português'),kind:'tpc',due:addDays(t,2),teams:true,example:true}));
  const teste=mkTask({title:'Teste de vocabulário e gramática',subject:S('Inglês'),kind:'teste',due:addDays(t,5),example:true});
  s.tasks.push(teste);
  buildPlan('teste',teste.due,teste.subject,teste.id,t,true).forEach(p=>s.tasks.push(p));
  s.tasks.push(mkTask({title:'Cartaz sobre os ecossistemas',subject:S('Ciências Naturais'),kind:'grupo',due:addDays(t,9),teams:true,example:true,
    steps:GROUP_STEPS.map(x=>({id:uid(),t:x,done:false}))}));
  s.tasks.push(mkTask({title:'Audição de canto',subject:S('Canto'),kind:'audicao',due:addDays(t,11),example:true}));
  return s;
}
function sanitize(s){
  if(!s||s.v!==1||!Array.isArray(s.tasks)||!Array.isArray(s.subjects))return null;
  const out=blank();
  out.subjects=s.subjects.filter(x=>x&&ID_RE.test(x.id||'')&&typeof x.name==='string').map(x=>({id:x.id,name:x.name.slice(0,40),color:isHex(x.color)?x.color:PALETTE[0]}));
  out.tasks=s.tasks.filter(t=>t&&ID_RE.test(t.id||'')&&typeof t.title==='string'&&DATE_RE.test(t.due||'')).map(t=>mkTask({
    id:t.id,title:t.title.slice(0,200),subject:typeof t.subject==='string'?t.subject:'',kind:KINDS[t.kind]?t.kind:'tpc',due:t.due,
    done:!!t.done,doneAt:typeof t.doneAt==='number'?t.doneAt:null,notes:typeof t.notes==='string'?t.notes.slice(0,1000):'',
    teams:!!t.teams,example:!!t.example,parent:typeof t.parent==='string'&&ID_RE.test(t.parent)?t.parent:null,
    steps:Array.isArray(t.steps)?t.steps.filter(x=>x&&typeof x.t==='string').map(x=>({id:ID_RE.test(x.id||'')?x.id:uid(),t:x.t.slice(0,200),done:!!x.done})):[]
  }));
  out.sessions=(Array.isArray(s.sessions)?s.sessions:[]).filter(x=>x&&DATE_RE.test(x.date||'')&&typeof x.minutes==='number').map(x=>({
    id:ID_RE.test(x.id||'')?x.id:uid(),date:x.date,at:typeof x.at==='number'?x.at:0,minutes:Math.max(0,Math.min(300,Math.round(x.minutes))),
    subject:typeof x.subject==='string'?x.subject:null,taskId:typeof x.taskId==='string'?x.taskId:null,label:typeof x.label==='string'?x.label.slice(0,200):''
  }));
  const p=s.prefs||{};
  out.prefs={size:p.size==='large'?'large':'normal',minutes:[10,15,25].indexOf(p.minutes)>=0?p.minutes:15,sound:p.sound!==false,rate:p.rate===.75?.75:.9};
  out.tt=Array.isArray(s.tt)?s.tt.filter(x=>x&&ID_RE.test(x.id||'')&&typeof x.day==='number'&&x.day>=0&&x.day<=6&&TIME_RE.test(x.start||'')&&TIME_RE.test(x.end||'')&&typeof x.name==='string').map(x=>({
    id:x.id,day:x.day|0,start:x.start,end:x.end,name:x.name.slice(0,60),subject:typeof x.subject==='string'?x.subject:'',
    kind:['aula','apoio','atividade'].indexOf(x.kind)>=0?x.kind:'aula',room:typeof x.room==='string'?x.room.slice(0,30):''
  })):null;
  out.plan=cleanPlan(s.plan);
  return out;
}
let storageOk=true;
function load(){try{const raw=localStorage.getItem(KEY);return raw?sanitize(JSON.parse(raw)):null}catch(e){return null}}
function probeStorage(){try{localStorage.setItem('__ce','1');localStorage.removeItem('__ce');return true}catch(e){return false}}
let saveT=null;
function writeNow(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOk=false;showNotice()}}
function save(){clearTimeout(saveT);saveT=setTimeout(writeNow,150)}
function flushSave(){if(saveT){clearTimeout(saveT);saveT=null;writeNow()}}
storageOk=probeStorage();
let state=load();
if(!state){state=seed();if(storageOk)writeNow()}
if(!state.tt){state.tt=buildTT();if(storageOk)writeNow()}
const cutoff=addDays(todayStr(),-120);
state.sessions=state.sessions.filter(x=>x.date>=cutoff);

/* ---------- consultas ---------- */
const find=id=>state.tasks.find(t=>t.id===id);
const subjOf=id=>state.subjects.find(s=>s.id===id)||{id:'',name:'Sem disciplina',color:'#868E96'};
const isEv=t=>KINDS[t.kind].ev;
const cmp=(a,b)=>a.due.localeCompare(b.due)||(isEv(b)-isEv(a))||a.title.localeCompare(b.title,'pt');
const pending=()=>state.tasks.filter(t=>!t.done).sort(cmp);
const actionable=()=>pending().filter(t=>KINDS[t.kind].act);
const events=()=>pending().filter(t=>isEv(t)&&t.due>=todayStr());
const hasExamples=()=>state.tasks.some(t=>t.example);
const sessionsOn=d=>state.sessions.filter(s=>s.date===d);
const minutesOn=d=>sessionsOn(d).reduce((a,s)=>a+s.minutes,0);

function dueText(t){
  const n=diff(t.due,todayStr());
  if(t.done)return 'Para '+dm(t.due);
  if(n<0)return isEv(t)?'Já passou':(n===-1?'Atrasada desde ontem':'Atrasada há '+(-n)+' dias');
  if(n===0)return 'Hoje';
  if(n===1)return 'Amanhã';
  if(n<7)return dayLabel(t.due);
  return dm(t.due);
}
function countdown(t){
  const n=diff(t.due,todayStr());
  if(n<0)return 'Já passou';
  if(n===0)return 'É hoje';
  if(n===1)return 'É amanhã';
  return 'Faltam '+n+' dias';
}
const isLate=t=>!t.done&&diff(t.due,todayStr())<0;

/* ---------- peças de HTML ---------- */
function subjChip(s){return '<span class="subj" style="--c:'+(isHex(s.color)?s.color:'#868E96')+'">'+esc(s.name)+'</span>'}
function tagsFor(t,o){
  let h='';
  if(t.kind!=='tpc'&&t.kind!=='revisao')h+='<span class="tag ev">'+esc(KINDS[t.kind].label)+'</span>';
  if(o.showDue)h+='<span class="tag'+(isLate(t)?' late':'')+'">'+esc(dueText(t))+'</span>';
  if(t.teams)h+='<span class="tag">Teams</span>';
  if(t.example)h+='<span class="tag ex">exemplo</span>';
  return h;
}
function rowHtml(t,o){
  o=o||{};

const mmss=s=>pad(Math.floor(s/60))+':'+pad(s%60);

  const t=$('#tTime');
  if(t){t.textContent=mmss(T.left);const r=$('#tRing');if(r)r.style.strokeDashoffset=String(2*Math.PI*90*(1-(T.total?T.left/T.total:0)))}

function ensureAudio(){
  if(!state.prefs.sound)return;
  try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}catch(e){}
}
function beep(){
  if(!state.prefs.sound||!audioCtx)return;
  try{[0,.35].forEach(d=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime+d;
    o.type='sine';o.frequency.value=784;
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.25,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+.3);
    o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+.32);
  })}catch(e){}
}
async function requestWake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{if(wake)wake.release()}catch(e){}wake=null}
function startTick(){stopTick();tickId=setInterval(tick,250)}
function stopTick(){if(tickId){clearInterval(tickId);tickId=null}}
function tick(){
  if(T.paused||(T.phase!=='focus'&&T.phase!=='break'))return;
  const left=Math.max(0,Math.ceil((T.endsAt-Date.now())/1000));
  T.left=left;
  if(left<=0)finishPhase();else updateTimerUI();
}
function logSession(min){
  if(min<1)return;
  const i=T.info||targetInfo('');
  state.sessions.push({id:uid(),date:todayStr(),at:Date.now(),minutes:min,subject:i.subject,taskId:i.taskId,label:i.label});
  save();
}
function finishPhase(){
  stopTick();releaseWake();beep();document.title='Caderno de Estudo';
  if(T.phase==='focus'){logSession(Math.round(T.total/60));T.phase='done';toast('Sessão terminada. Boa!')}
  else{T.phase='breakdone';toast('A pausa acabou.')}
  render();
}
function startFocus(){
  T.info=targetInfo(focusTarget);T.phase='focus';T.paused=false;T.total=state.prefs.minutes*60;T.left=T.total;T.endsAt=Date.now()+T.total*1000;
  ensureAudio();requestWake();startTick();render();
}
function startBreak(){T.phase='break';T.paused=false;T.total=300;T.left=300;T.endsAt=Date.now()+300000;ensureAudio();requestWake();startTick();render()}
function pauseT(){
  if(!T.paused){tick();T.paused=true;releaseWake()}
  else{T.endsAt=Date.now()+T.left*1000;T.paused=false;requestWake()}
  render();
}
function stopT(){
  if(T.phase==='focus'){tick();logSession(Math.floor((T.total-T.left)/60))}
  stopTick();releaseWake();T.phase='idle';T.paused=false;document.title='Caderno de Estudo';render();
}

/* ler em voz alta */
const R={text:'',chunks:[],i:-1,on:false,tok:0,u:null};
function parseChunks(text){
  const out=[];
  String(text).replace(/\r/g,'').split('\n').forEach((line,li,arr)=>{
    const parts=line.match(/.+?(?:[.!?]+(?=\s|$)|$)/g)||[];
    parts.forEach(p=>{
      const t=p.trim();
      if(!t){if(out.length)out[out.length-1].gap+=p;return}
      const lead=p.slice(0,p.length-p.trimStart().length);
      if(lead&&out.length)out[out.length-1].gap+=lead;
      const prev=out[out.length-1];
      if(prev&&/^\d+[.)]$/.test(prev.t)&&prev.gap.indexOf('\n')<0){prev.t+=' '+t;prev.gap=p.slice(p.trimEnd().length);return}
      out.push({t:t,gap:p.slice(p.trimEnd().length)});
    });
    if(li<arr.length-1&&out.length)out[out.length-1].gap+='\n';
  });
  return out;
}
function pickVoice(){
  try{const v=speechSynthesis.getVoices();return v.find(x=>x.lang==='pt-PT')||v.find(x=>/^pt/i.test(x.lang))||null}catch(e){return null}
}
function markRead(){
  const els=document.querySelectorAll('.rtext .sn');
  Array.prototype.forEach.call(els,(el,i)=>{
    const on=i===R.i;el.classList.toggle('on',on);
    if(on)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');
  });
  if(R.i>=0&&els[R.i]){try{els[R.i].scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}
}
function sayChunk(i,tok){
  if(tok!==R.tok)return;
  if(i>=R.chunks.length){R.on=false;R.i=-1;markRead();return}
  R.i=i;markRead();
  const u=new SpeechSynthesisUtterance(R.chunks[i].t);
  u.lang='pt-PT';u.rate=state.prefs.rate;
  const v=pickVoice();if(v)u.voice=v;
  u.onend=()=>sayChunk(i+1,tok);
  u.onerror=()=>{if(tok===R.tok){R.on=false;R.i=-1;markRead()}};
  R.u=u;
  try{speechSynthesis.speak(u)}catch(e){}
}
function startRead(i){
  if(!canSpeak||!R.chunks.length)return;
  R.tok++;R.on=true;
  try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel()}catch(e){}
  sayChunk(i,R.tok);
}
function stopRead(){
  R.tok++;R.on=false;R.i=-1;
  try{if(canSpeak&&(speechSynthesis.speaking||speechSynthesis.pending))speechSynthesis.cancel()}catch(e){}
  markRead();
}

/* ---------- horário escolar e plano de estudo ---------- */
function hm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function toMin(s){const p=String(s).split(':');return (+p[0]||0)*60+(+p[1]||0)}
function addMin(t,m){return hm(Math.min(23*60+59,toMin(t)+m))}
function dayOf(s){return parse(s).getDay()}
function ttFor(i){return (state.tt||[]).filter(x=>x.day===i).sort((a,b)=>a.start.localeCompare(b.start))}
function afterItems(d){return ttFor(dayOf(d)).filter(x=>x.kind!=='aula'||x.start>='14:55')}
function subjByName(n){const s=state.subjects.find(x=>x.name===n);return s?s.id:''}

function reviewList(d){
  const skip=['Educação Física','Canto','Estúdio de Ópera'];
  for(let b=0;b<4;b++){
    const dd=addDays(d,-b),di=dayOf(dd),subs=[];
    ttFor(di).forEach(x=>{
      if(x.kind==='aula'&&x.subject&&skip.indexOf(subjOf(x.subject).name)<0&&subs.indexOf(x.subject)<0)subs.push(x.subject);
    });
    if(subs.length){
      const rot=Math.floor(parse(d)/864e5)%subs.length;
      const r=subs.slice(rot).concat(subs.slice(0,rot));
      const soon=id=>{let m=99;state.tasks.forEach(t=>{if(!t.done&&isEv(t)&&t.subject===id){const k=diff(t.due,d);if(k>=0&&k<m)m=k}});return m};
      r.sort((a,b)=>soon(a)-soon(b));
      return{list:r,note:b===0?'aula de hoje':b===1?'aula de ontem':'aula de '+WDL[di]};
    }
  }
  return{list:[],note:''};
}
function pickStudy(d,n){
  const c=[];
  state.tasks.forEach(t=>{
    if(t.done)return;
    const k=diff(t.due,d),par=t.parent?find(t.parent):null;
    if(t.kind==='revisao'){
      if(k<=0&&k>=-3)c.push({score:k===0?100:90+k,title:t.title+(par?' — '+par.title:''),subject:t.subject,task:t.id,note:k===0?'':'em atraso'});
    }else if(KINDS[t.kind].act){
      if(k<0)c.push({score:95,title:t.title,subject:t.subject,task:t.id,note:'em atraso'});
      else if(k<=2)c.push({score:80-k*10,title:t.title,subject:t.subject,task:t.id,note:k===0?'para hoje':k===1?'para amanhã':'para '+dm(t.due)});
    }else if(isEv(t)&&k>=0&&k<=7){
      if(!state.tasks.some(x=>x.parent===t.id&&!x.done))c.push({score:60-k*3,title:'Rever para: '+t.title,subject:t.subject,task:'',note:k===0?'é hoje':k===1?'é amanhã':'em '+k+' dias'});
    }
  });
  c.sort((a,b)=>b.score-a.score);
  const out=[],seen={};
  c.forEach(x=>{const key=x.task||x.title;if(out.length<n&&!seen[key]){seen[key]=1;out.push(x)}});
  if(out.length<n){
    const rv=reviewList(d),used=out.map(x=>x.subject);
    const pool=rv.list.filter(s=>used.indexOf(s)<0).concat(rv.list.filter(s=>used.indexOf(s)>=0));
    let i=0;
    while(out.length<n){
      if(pool.length){const sid=pool[i%pool.length];i++;out.push({title:'Rever '+subjOf(sid).name,subject:sid,task:'',note:rv.note})}
      else out.push({title:'Organizar a mochila e ver o horário de amanhã',subject:'',task:'',note:''});
    }
  }
  return out;
}
function planItems(d){
  const set=state.plan.days[dayOf(d)];
  if(!set)return[];
  const out=[],picks=set.n>0?pickStudy(d,set.n):[];
  picks.forEach((p,i)=>out.push({key:d+':b'+(i+1),kind:'study',time:addMin(set.at,i*15),mins:10,title:p.title,subject:p.subject,task:p.task,note:p.note}));
  if(set.canto)out.push({key:d+':c',kind:'canto',time:set.cantoAt,mins:10,title:'Treino de canto',subject:subjByName('Canto'),task:'',note:'aquecer e cantar o repertório'});
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function pastPlan(d){
  const out=[];
  ['b1','b2','c'].forEach(s=>{
    const k=d+':'+s,x=state.plan.done[k];
    if(x)out.push({key:k,kind:s==='c'?'canto':'study',time:'',mins:10,title:x.t,subject:x.s,task:'',note:''});
  });
  return out;
}
function planRow(it,d,go){
  const done=state.plan.done[it.key];
  const title=done?done.t:it.title,sid=done?done.s:it.subject;
  const when=it.time?esc(it.time)+' · '+it.mins+' min':it.mins+' min';
  return '<li class="task'+(done?' done':'')+'"><button class="check" role="checkbox" aria-checked="'+(!!done)+'" data-act="planCheck" data-key="'+esc(it.key)+'" data-d="'+esc(d)+'" aria-label="'+(done?'Desmarcar':'Marcar como feito')+': '+esc(title)+'"><span class="box"></span></button>'+
    '<div class="tbody"><p class="ptime">'+when+'</p><p class="ptitle">'+esc(title)+'</p>'+
    '<div class="meta">'+(sid?subjChip(subjOf(sid)):'')+(it.note&&!done?'<span class="tag">'+esc(it.note)+'</span>':'')+'</div>'+
    (go&&!done?'<div><button class="btn" data-act="planGo" data-key="'+esc(it.key)+'" data-d="'+esc(d)+'">Começar</button></div>':'')+'</div></li>';
}

function viewPlano(){
  const today=todayStr(),end=addDays(weekStart,6);
  let h='<p class="muted">Blocos curtos de 10 minutos, escolhidos a partir dos testes, apresentações e TPC.</p>'+
    '<div class="week-nav"><button class="btn" data-act="weekPrev" aria-label="Semana anterior">‹</button><p class="t">'+esc(rangeLabel(weekStart,end))+'</p><button class="btn" data-act="weekNext" aria-label="Semana seguinte">›</button></div>';
  if(weekStart!==mondayOf(today))h+='<button class="btn quiet" data-act="weekToday">Voltar a esta semana</button>';
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i);
    const items=d<today?pastPlan(d):planItems(d),more=afterItems(d);
    h+='<section class="day'+(d===today?' today':'')+'" aria-label="'+esc(dayLabel(d))+'"><div class="day-head"><h3>'+esc(dayLabel(d))+(d===today?' · hoje':'')+'</h3>'+
      '<button class="btn quiet" data-act="planDay" data-day="'+dayOf(d)+'">Ajustar</button></div>'+
      (more.length?'<p class="muted small">Também: '+more.map(x=>esc(x.start+' '+x.name)).join(' · ')+'</p>':'')+
      (items.length?'<ul class="list">'+items.map(it=>planRow(it,d,d===today)).join('')+'</ul>':'<p class="none">'+(d<today?'Sem registo.':'Descanso, sem estudo marcado.')+'</p>')+'</section>';
  }
  return h;
}

function submitTT(f){
  const fd=new FormData(f),id=f.dataset.id,err=$('#tErr',f);
  const bad=m=>{err.textContent=m;err.hidden=false};
  const start=String(fd.get('start')||''),end=String(fd.get('end')||'');
  const type=['aula','apoio','atividade'].indexOf(fd.get('type'))>=0?fd.get('type'):'aula';
  const subj=type==='aula'?String(fd.get('subject')||''):'';
  let name=String(fd.get('name')||'').trim();
  if(!TIME_RE.test(start)||!TIME_RE.test(end))return bad('Escolhe a hora de início e a de fim.');
  if(toMin(end)<=toMin(start))return bad('A hora de fim tem de ser depois da de início.');
  if(type==='apoio'&&!name)name='Apoio ao Estudo';
  if(type==='aula'&&!name){const s=state.subjects.find(x=>x.id===subj);name=s?s.name:'Aula'}
  if(!name)return bad('Escreve o nome da atividade.');
  const day=Math.max(0,Math.min(6,Number(fd.get('day'))||0));
  const row={day:day,start:start,end:end,name:name.slice(0,60),subject:subj,kind:type,room:String(fd.get('room')||'').trim().slice(0,30)};
  if(id){const it=state.tt.find(x=>x.id===id);if(it)Object.assign(it,row)}
  else state.tt.push(Object.assign({id:uid()},row));
  save();closeSheet();render();toast('Guardado');
}

}
function submitPlanDay(f){
  const fd=new FormData(f),day=Number(f.dataset.day),err=$('#pErr',f);
  const n=[0,1,2].indexOf(Number(fd.get('n')))>=0?Number(fd.get('n')):1;
  const at=String(fd.get('at')||''),ca=String(fd.get('cantoAt')||''),canto=!!fd.get('canto');
  if((n>0&&!TIME_RE.test(at))||(canto&&!TIME_RE.test(ca))){err.textContent='Escolhe as horas.';err.hidden=false;return}
  const cur=state.plan.days[day];
  state.plan.days[day]={n:n,at:TIME_RE.test(at)?at:cur.at,canto:canto,cantoAt:TIME_RE.test(ca)?ca:cur.cantoAt};
  save();closeSheet();render();toast('Guardado');
}

const canSpeak=typeof window!=='undefined'&&'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function speak(text){
  if(!canSpeak)return;
  try{if(speechSynthesis.speaking){speechSynthesis.cancel();return}const u=new SpeechSynthesisUtterance(text);u.lang='pt-PT';u.rate=.9;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
}
async function copyText(text,ta){
  try{await navigator.clipboard.writeText(text);toast('Copiado')}
  catch(e){if(ta){ta.focus();ta.select();toast('Seleciona o texto e copia')}else toast('Não consegui copiar')}
}

    '<form data-form="task"'+(edit?' data-id="'+esc(t.id)+'"':'')+' novalidate>'+
    '<fieldset class="field"><legend>O que é?</legend><div class="kinds">'+FORM_KINDS.concat(edit&&t.kind==='revisao'?['revisao']:[]).map(k=>'<label class="kind"><input type="radio" name="kind" value="'+k+'"'+(k===kind?' checked':'')+'><span>'+esc(KINDS[k].label)+'</span></label>').join('')+'</div></fieldset>'+
    '<div class="field"><label for="fSubj">Disciplina</label><select id="fSubj" name="subject">'+(subs||'<option value="">Sem disciplina</option>')+'</select></div>'+
    '<div class="field"><label for="fTitle">Título</label><input id="fTitle" name="title" type="text" maxlength="200" autocomplete="off" placeholder="'+esc(PLACEHOLDER[kind]||'')+'" value="'+esc(t?t.title:'')+'"><p class="err" id="fErr" role="alert" hidden></p></div>'+
    '<div class="field"><label for="fDue">Data</label><input id="fDue" name="due" type="date" value="'+esc(due)+'"></div>'+
    '<div class="field checkline"><label><input type="checkbox" name="teams"'+(t&&t.teams?' checked':'')+'> É uma tarefa do Teams</label></div>'+
    (edit?'':'<div class="field checkline" id="planBox"'+(PLAN_LABEL[kind]?'':' hidden')+'><label><input type="checkbox" name="plan" checked> <span id="planLbl">'+esc(PLAN_LABEL[kind]||'')+'</span></label></div>')+
    '<div class="field"><label for="fNotes">Notas (opcional)</label><textarea id="fNotes" name="notes" rows="3" maxlength="1000">'+esc(t?t.notes:'')+'</textarea></div>'+
    '<div class="actions"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" data-act="closeSheet">Cancelar</button></div></form>';
}
function openForm(t,preset){openSheet(formHtml(t,preset||{}));const i=$('#fTitle');if(i&&!t)setTimeout(()=>{try{i.focus()}catch(e){}},50)}
function submitTask(form){
  const fd=new FormData(form),id=form.dataset.id;
  const title=String(fd.get('title')||'').trim(),due=String(fd.get('due')||''),kind=String(fd.get('kind')||'tpc');
  const err=$('#fErr',form);
  function bad(msg,sel){err.textContent=msg;err.hidden=false;const el=$(sel,form);if(el)el.focus()}
  if(!title)return bad('Escreve o que tens de fazer.','#fTitle');
  if(!DATE_RE.test(due))return bad('Escolhe a data.','#fDue');
  const base={title:title.slice(0,200),subject:String(fd.get('subject')||''),kind:KINDS[kind]?kind:'tpc',due:due,teams:!!fd.get('teams'),notes:String(fd.get('notes')||'').trim().slice(0,1000)};
  if(id){const t=find(id);if(t)Object.assign(t,base);save();closeSheet();render();toast('Guardado');return}
  const t=mkTask(base);state.tasks.push(t);
  let extra=0;
  if(fd.get('plan')){
    if(kind==='grupo')t.steps=GROUP_STEPS.map(x=>({id:uid(),t:x,done:false}));
    else{const plan=buildPlan(kind,t.due,t.subject,t.id,todayStr(),false);plan.forEach(p=>state.tasks.push(p));extra=plan.length}
  }
  save();closeSheet();render();
  toast(extra?'Guardado, com '+extra+(extra===1?' dia':' dias')+' de preparação':'Guardado');
}

/* ---------- ações ---------- */
function toggleTask(id,fromSheet){
  const t=find(id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?Date.now():null;save();
  if(fromSheet)closeSheet();
  render();
  if(t.done)toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
}
function speakTask(id){
  const t=find(id);if(!t)return;
  const steps=t.steps.length?' Passos: '+t.steps.map(s=>s.t).join('. ')+'.':'';
  speak(subjOf(t.subject).name+'. '+t.title+'. '+dueText(t)+'.'+steps);
}
function removeTask(id){
  state.tasks=state.tasks.filter(t=>t.id!==id&&t.parent!==id);
  save();closeSheet();render();toast('Apagado');
}
const A={
  closeSheet:()=>closeSheet(),
  newTask:()=>openForm(null,{}),
  newEvent:()=>openForm(null,{kind:'teste',due:addDays(todayStr(),7)}),
  addDay:el=>openForm(null,{due:el.dataset.day}),
  open:(el,id)=>openDetail(id),
  toggle:(el,id)=>toggleTask(id,false),
  sheetToggle:(el,id)=>toggleTask(id,true),
  stepToggle:(el,id)=>{const t=find(id);if(!t)return;const s=t.steps.find(x=>x.id===el.dataset.sid);if(s){s.done=!s.done;save();render();if(sheetTaskId)refreshDetail()}},
  nextNow:()=>{nowIdx++;render()},
  focusTask:(el,id)=>{focusTarget='t:'+id;location.hash='#foco'},
  speakTask:(el,id)=>speakTask(id),
  editTask:(el,id)=>{const t=find(id);if(t)openSheet(formHtml(t,{}))},
  deleteTask:(el,id)=>{
    if(el.dataset.sure==='1'){removeTask(id);return}
    el.dataset.sure='1';el.textContent='Carrega outra vez para apagar';
    setTimeout(()=>{if(document.contains(el)){el.dataset.sure='';el.textContent='Apagar'}},4000);
  },
  filter:el=>{filter=el.dataset.f;render()},
  weekPrev:()=>{weekStart=addDays(weekStart,-7);render()},
  weekNext:()=>{weekStart=addDays(weekStart,7);render()},
  weekToday:()=>{weekStart=mondayOf(todayStr());render()},
  preset:el=>{state.prefs.minutes=Number(el.dataset.m);save();render()},
  startFocus:()=>startFocus(),
  startBreak:()=>startBreak(),
  pauseT:()=>pauseT(),
  stopT:()=>stopT(),
  endT:()=>{T.phase='idle';render()},
  setSize:el=>{state.prefs.size=el.dataset.v==='large'?'large':'normal';document.documentElement.dataset.size=state.prefs.size;save();render()},
  delSubject:(el,id)=>{
    if(el.dataset.sure==='1'){state.subjects=state.subjects.filter(s=>s.id!==id);save();render();return}
    el.dataset.sure='1';el.textContent='Apagar? As tarefas ficam sem disciplina';
    setTimeout(()=>{if(document.contains(el)){el.dataset.sure='';el.textContent='Apagar'}},4000);
  },
  copySummary:()=>copyText($('#sumTa').value,$('#sumTa')),
  copyBackup:()=>{const ta=$('#bkTa');ta.value=JSON.stringify(state);copyText(ta.value,ta)},
  restore:el=>{
    const ta=$('#bkTa');let data=null;
    try{data=sanitize(JSON.parse(ta.value))}catch(e){}
    if(!data){toast('Esse texto não é uma cópia válida');return}
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Carrega outra vez para substituir os dados atuais';setTimeout(()=>{if(document.contains(el)){el.dataset.sure='';el.textContent='Restaurar desta cópia'}},4000);return}
    state=data;if(!state.tt)state.tt=buildTT();document.documentElement.dataset.size=state.prefs.size;save();render();toast('Cópia restaurada');
  },
  clearExamples:()=>{state.tasks=state.tasks.filter(t=>!t.example);save();render();toast('Exemplos apagados')},
  readStart:()=>{
    const ta=$('#readTa');
    if(ta){R.text=ta.value;R.chunks=parseChunks(R.text);if(!R.chunks.length){toast('Cola primeiro o texto do exercício');return}render()}
    startRead(0);
  },
  readStop:()=>stopRead(),
  weekMode:el=>{weekMode=el.dataset.m;render()},
  goPlan:()=>{weekMode='plano';weekStart=mondayOf(todayStr());location.hash='#semana'},
  planCheck:el=>{
    const key=el.dataset.key,d=el.dataset.d;
    if(state.plan.done[key]){delete state.plan.done[key];save();render();return}
    const it=planItems(d).find(x=>x.key===key);if(!it)return;
    state.plan.done[key]={t:it.title,s:it.subject||''};
    const t=it.task?find(it.task):null;
    if(t&&t.kind==='revisao'&&!t.done){t.done=true;t.doneAt=Date.now()}
    save();render();toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
  },
  planGo:el=>{
    const it=planItems(el.dataset.d).find(x=>x.key===el.dataset.key);if(!it)return;
    focusTarget=it.task?'t:'+it.task:(it.subject?'s:'+it.subject:'');
    state.prefs.minutes=10;save();location.hash='#foco';
  },
  planDay:el=>openSheet(planDayForm(Number(el.dataset.day))),
  ttAdd:el=>openSheet(ttFormHtml(null,Number(el.dataset.day))),
  ttEdit:(el,id)=>{const it=(state.tt||[]).find(x=>x.id===id);if(it)openSheet(ttFormHtml(it,it.day))},
  ttDel:(el,id)=>{
    if(el.dataset.sure==='1'){state.tt=state.tt.filter(x=>x.id!==id);save();closeSheet();render();toast('Apagado');return}
    el.dataset.sure='1';el.textContent='Carrega outra vez para apagar';
    setTimeout(()=>{if(document.contains(el)){el.dataset.sure='';el.textContent='Apagar'}},4000);
  },
  addSubj:el=>{
    const n=el.dataset.n;if(!n)return;
    const used=state.subjects.map(s=>s.color);
    const color=PALETTE.find(c=>used.indexOf(c)<0)||PALETTE[state.subjects.length%PALETTE.length];
    state.subjects.push({id:uid(),name:n.slice(0,40),color:color});save();render();
  },
  readFrom:el=>startRead(Number(el.dataset.i)||0),
  readEdit:()=>{stopRead();R.chunks=[];render()},
  readClear:()=>{R.text='';render();const t=$('#readTa');if(t)t.focus()},
  setRate:el=>{state.prefs.rate=Number(el.dataset.v)===.75?.75:.9;save();render()},
  wipe:el=>{
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Carrega outra vez para apagar tudo';setTimeout(()=>{if(document.contains(el)){el.dataset.sure='';el.textContent='Apagar tudo'}},4000);return}
    const keep=state.subjects,tt=state.tt,plan=state.plan;state=blank();state.subjects=keep;state.tt=tt;state.plan=plan;state.plan.done={};save();render();toast('Tudo apagado')
  }
};

document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  const holder=el.dataset.id?el:el.closest('[data-id]');
  fn(el,el.dataset.id||(holder&&holder.dataset.id)||'',e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const kind=f.dataset.form;
  if(kind==='task')submitTask(f);
  else if(kind==='tt')submitTT(f);
  else if(kind==='planday')submitPlanDay(f);
  else if(kind==='step'){
    const t=find(f.dataset.id),v=String(new FormData(f).get('s')||'').trim();
    if(t&&v){t.steps.push({id:uid(),t:v.slice(0,200),done:false});save();render();refreshDetail();const i=$('#sheet input[name="s"]');if(i)i.focus()}
  }else if(kind==='subject'){
    const v=String(new FormData(f).get('n')||'').trim();
    if(v){const used=state.subjects.map(s=>s.color);const color=PALETTE.find(c=>used.indexOf(c)<0)||PALETTE[state.subjects.length%PALETTE.length];state.subjects.push({id:uid(),name:v.slice(0,40),color:color});save();render()}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches&&el.matches('[data-change="target"]')){focusTarget=el.value;return}
  if(el.matches&&el.matches('[data-change="sound"]')){state.prefs.sound=el.checked;save();return}
  if(el.name==='kind'){
    const f=el.closest('form');if(!f)return;
    const k=el.value,box=$('#planBox',f),inp=$('#fTitle',f);
    if(inp)inp.placeholder=PLACEHOLDER[k]||'';
    if(box){box.hidden=!PLAN_LABEL[k];const l=$('#planLbl',f);if(l)l.textContent=PLAN_LABEL[k]||''}
    if(!dueTouched&&!f.dataset.id){$('#fDue',f).value=addDays(todayStr(),k==='tpc'?1:7)}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='fDue')dueTouched=true;if(e.target.id==='readTa')R.text=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){tick();if((T.phase==='focus'||T.phase==='break')&&!T.paused)requestWake()}
  else flushSave();
});
window.addEventListener('pagehide',flushSave);
window.addEventListener('hashchange',route);

document.documentElement.dataset.size=state.prefs.size;
showNotice();
route();
})();
</script>
